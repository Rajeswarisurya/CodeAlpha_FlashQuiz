<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Study Flashcards</h1>
      <p class="counter" id="cardCounter">Card 1 of 3</p>
    </header>

    <!-- Main Flashcard -->
    <div class="flashcard">
      <span class="card-badge" id="cardBadge">Question</span>
      <p class="card-text" id="cardText"></p>
    </div>

    <!-- Navigation & Reveal Controls -->
    <div class="controls">
      <button class="btn-secondary" id="prevBtn">← Previous</button>
      <button class="btn-primary" id="toggleAnswerBtn">Show Answer</button>
      <button class="btn-secondary" id="nextBtn">Next →</button>
    </div>

    <!-- Add / Edit / Delete Controls -->
    <div class="manage-bar">
      <button class="btn-primary" id="openAddBtn">+ Add Card</button>
      <div class="action-group">
        <button class="btn-secondary" id="openEditBtn">Edit</button>
        <button class="btn-danger" id="deleteBtn">Delete</button>
      </div>
    </div>

    <!-- Add / Edit Form -->
    <div class="form-panel" id="formPanel">
      <h2 id="formTitle">Add New Flashcard</h2>
      <form id="cardForm">
        <div class="form-group">
          <label for="questionInput">Question (Front)</label>
          <textarea id="questionInput" placeholder="Enter your study question..." required></textarea>
        </div>
        <div class="form-group">
          <label for="answerInput">Answer (Back)</label>
          <textarea id="answerInput" placeholder="Enter the answer..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
